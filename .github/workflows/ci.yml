name: ci

on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pytest==8.2.0
      - name: Unit tests (envelope, drift, merge contract, benchmark math)
        run: python -m pytest -q
      - name: Compile the Spark jobs
        run: python -m compileall -q pipeline generator bench
